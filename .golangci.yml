version: "2"

run:
  build-tags: [e2e]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [noctx, bodyclose]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/tfyl/jkvm]
